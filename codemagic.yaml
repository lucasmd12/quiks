workflows:
  android-profile-build:
    name: DevDeck Android Profile Build

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    environment:
      flutter: stable
      vars:
        JVM_ARGS: "-Xmx12g"

    scripts:
      - name: Configurar Flutter
        script: |
          flutter config --enable-android
          flutter doctor

      - name: Limpar cache
        script: flutter clean

      - name: Dependências
        script: flutter pub get

      - name: Build APK Profile
        script: |
          cd $CM_BUILD_DIR
          flutter build apk --profile

    artifacts:
      - build/app/outputs/flutter-apk/app-profile.apk
